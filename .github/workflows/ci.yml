name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"

jobs:
  lint:
    name: Lint and module boundaries
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

  test:
    name: Tests (PostgreSQL 18.6)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: acme
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acme -d acme"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      AUTH_TOKENS: customer:00000000-0000-4000-8000-000000000001:ci-only-customer-token
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest

  clean-clone:
    name: make up + make test from a clean clone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make up
      - run: curl -fsS http://localhost:8000/health
      - run: make test
      - if: always()
        run: docker compose logs
      - if: always()
        run: make down
