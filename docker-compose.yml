services:
  db:
    image: postgres:18.6-alpine
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql

  app:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://localhost:8000/health', timeout=3).status != 200)"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
